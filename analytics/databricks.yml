# This is a Declarative Automation Bundle definition for analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: analytics
  uuid: 4b935fae-c2cc-4529-9bb9-526da980fa1d

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-7678e2d5-985b.cloud.databricks.com
    variables:
      catalog: analytics_dev
      schema: rnd
  prod:
    mode: production
    workspace:
      host: https://dbc-7678e2d5-985b.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/adi789kumar@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/adi789kumar@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: analytics_dev
      schema: prod
    permissions:
      - user_name: adi789kumar@gmail.com
        level: CAN_MANAGE
